# ──────────────────────────────────────────────────────────────────────────
# PRODUCTION DEPLOYMENT SETUP
# ──────────────────────────────────────────────────────────────────────────
# Optimized for production:
# - Host-mounted data in ./data/ (mongo, hf_cache)
# - Named volumes for Grafana and Prometheus state
# - Services on the 'proxy' network
# - Resource limits and health checks

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # ── MongoDB database ────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: nlp_mongodb
    restart: always
    networks:
      - proxy
    volumes:
      - ./data/mongo:/data/db
    environment:
      MONGO_INITDB_DATABASE: admin
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=mongodb"

  # ── Job scheduler / pipeline runner ──────────────────────────────────────
  jobs:
    build:
      context: .
      dockerfile: Dockerfile
    image: nlp-analyzer:latest
    container_name: nlp_jobs
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - proxy
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      RAW_DB_NAME: ${RAW_DB_NAME:-nlp_raw}
      CLEAN_DB_NAME: ${CLEAN_DB_NAME:-nlp_clean}
      CLASSIFIED_DB_NAME: ${CLASSIFIED_DB_NAME:-nlp_classified}
      MODELS_DB_NAME: ${MODELS_DB_NAME:-nlp_models}
      NER_DB_NAME: ${NER_DB_NAME:-nlp_ner}
      NER_COLLECTION: ${NER_COLLECTION:-ner_articles}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      KAGGLE_ENABLED: "true"
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY: ${KAGGLE_KEY}
      SKIP_BOOTSTRAP: "false"
    command: wait
    volumes:
      - ./data/hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=jobs"

  # ── Frontend dashboard (React SPA) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: nlp-frontend:latest
    container_name: nlp_frontend
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxy
    expose:
      - "80"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=frontend"

  # ── FastAPI web service (REST API) ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nlp-analyzer:latest
    container_name: nlp_api
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - proxy
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      RAW_DB_NAME: ${RAW_DB_NAME:-nlp_raw}
      CLEAN_DB_NAME: ${CLEAN_DB_NAME:-nlp_clean}
      CLASSIFIED_DB_NAME: ${CLASSIFIED_DB_NAME:-nlp_classified}
      MODELS_DB_NAME: ${MODELS_DB_NAME:-nlp_models}
      NER_DB_NAME: ${NER_DB_NAME:-nlp_ner}
      NER_COLLECTION: ${NER_COLLECTION:-ner_articles}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      KAGGLE_ENABLED: "false"
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY: ${KAGGLE_KEY}
      SKIP_BOOTSTRAP: "true"
    command: api
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=api"

  # ── Prometheus metrics collector ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nlp_prometheus
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxy
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus.alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=prometheus"

  # ── Grafana dashboard ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: nlp_grafana
    restart: always
    depends_on:
      - prometheus
    networks:
      - proxy
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/nlp_pipeline.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service=grafana"

networks:
  proxy:
    external: true
    name: proxy
