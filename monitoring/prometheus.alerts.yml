groups:
  - name: nlp_pipeline
    rules:
      - alert: ApiDown
        expr: up{job="nlp_api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NLP API is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}"

      - alert: HighApiErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "5xx rate is {{ $value | humanizePercentage }}"

      - alert: HighApiLatency
        expr: |
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API P99 latency"
          description: "P99 latency is {{ $value }}s"

      - alert: JobDurationHigh
        expr: |
          histogram_quantile(0.99,
            rate(job_duration_seconds_bucket[5m])
          ) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Job taking too long"
          description: "Job {{ $labels.job_name }} P99 duration is {{ $value }}s"
