# ──────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT SETUP
# ──────────────────────────────────────────────────────────────────────────
# 
# This compose stack is optimized for local development:
# - Single MongoDB service with attached volumes
# - Job runner for manual/scheduled job execution
# - FastAPI service for testing REST endpoints
# - React frontend for data visualization
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose logs -f api        # Follow API logs
#   docker-compose exec mongodb mongosh  # Connect to MongoDB
#   docker-compose down               # Stop and clean

volumes:
  mongo_data:
    driver: local
  hf_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # ── MongoDB database (containerized local instance) ─────────────────────
  mongodb:
    image: mongo:7.0
    container_name: nlp_mongodb_dev
    restart: unless-stopped
    command: ["mongod", "--slowms", "5000"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: admin
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nlp_network

  # ── Job scheduler / pipeline runner ──────────────────────────────────────
  jobs:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from: []  # rely on BuildKit cache mounts, not registry cache
    container_name: nlp_jobs_dev
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      RAW_DB_NAME: nlp_raw
      CLEAN_DB_NAME: nlp_clean
      CLASSIFIED_DB_NAME: nlp_classified
      MODELS_DB_NAME: nlp_models
      NER_DB_NAME: nlp_ner
      NER_COLLECTION: ner_articles
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      KAGGLE_ENABLED: "true"
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY: ${KAGGLE_KEY}
      SKIP_BOOTSTRAP: "false"
      SKIP_RANK1_RECOVERY: "true"
      RUN_CLEAN_AFTER_SCRAPE: "true"
      ENGLISH_ONLY: "true"
      OMP_NUM_THREADS: "10"
      MKL_NUM_THREADS: "10"
      NVIDIA_VISIBLE_DEVICES: "all"
    # Entrypoint handles init + bootstrap, then waits for manual job execution
    # Manually trigger jobs via: docker-compose exec jobs python scripts/run_job.py scrape
    # Or schedule via cron using orchestrate_jobs.sh
    command: wait
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
      - hf_cache:/root/.cache/huggingface
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nlp_network

  # ── FastAPI web service (REST API) ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from: []  # rely on BuildKit cache mounts, not registry cache
    container_name: nlp_api_dev
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:80"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongodb:27017
      RAW_DB_NAME: nlp_raw
      CLEAN_DB_NAME: nlp_clean
      CLASSIFIED_DB_NAME: nlp_classified
      MODELS_DB_NAME: nlp_models
      NER_DB_NAME: nlp_ner
      NER_COLLECTION: ner_articles
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      KAGGLE_ENABLED: "false"
      SKIP_BOOTSTRAP: "false"
    command: api
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
      - hf_cache:/root/.cache/huggingface
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nlp_network

  # ── React/Vite frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nlp_frontend_dev
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    networks:
      - nlp_network

  # ── Prometheus metrics collector ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nlp_prometheus_dev
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - nlp_network

  # ── Grafana dashboard ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: nlp_grafana_dev
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/nlp_pipeline.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - nlp_network

networks:
  nlp_network:
    driver: bridge
