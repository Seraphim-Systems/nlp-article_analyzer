name: Reusable Deploy

on:
  workflow_call:
    inputs:
      deploy_path:
        description: "Target directory on the server"
        required: false
        type: string
        default: "~/nlp-project"
      environment:
        description: "GitHub environment name"
        required: false
        type: string
        default: "production"
    secrets:
      HETZNER_IP:
        required: true
      HETZNER_USER:
        required: true
      HETZNER_PORT:
        required: false
      HETZNER_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -e
            echo "--- Starting Deployment to ${{ inputs.deploy_path }} ---"
            
            # 1. Prepare directory
            mkdir -p ${{ inputs.deploy_path }}
            cd ${{ inputs.deploy_path }}

            # 2. Sync Code
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # 3. Identify Compose File
            COMPOSE_FILE="docker-compose.yml"
            [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"
            echo "Using config: $COMPOSE_FILE"

            # 4. Orchestrate
            docker compose -f $COMPOSE_FILE build
            docker compose -f $COMPOSE_FILE up -d

            # 5. Housekeeping
            docker image prune -f
            echo "--- Deployment Successful ---"
