name: Reusable Deploy

on:
  workflow_call:
    inputs:
      deploy_path:
        description: "Target directory on the server"
        required: false
        type: string
        default: "~/nlp-project"
      environment:
        description: "GitHub environment name"
        required: false
        type: string
        default: "production"
      reset_volumes:
        description: "If true, remove contents of <deploy_path>/data before deploying"
        required: false
        type: string
        default: 'false'
    secrets:
      HETZNER_IP:
        required: true
      HETZNER_USER:
        required: true
      HETZNER_PORT:
        required: false
      HETZNER_KEY:
        required: true
      env_vars:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -e
            echo "--- Starting Deployment to ${{ inputs.deploy_path }} ---"
            
            # 1. Prepare directory
            mkdir -p ${{ inputs.deploy_path }}/data/{hf_cache,mongo,prometheus,grafana}
            cd ${{ inputs.deploy_path }}

            # 2. Sync Code
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # 3. Optional: reset persistent volumes/data directory and drop DBs (after compose files are available)
            if [ "${{ inputs.reset_volumes }}" = "true" ]; then
              echo "--- Resetting volumes at ${{ inputs.deploy_path }}/data ---"

              # Determine compose file (same logic used later)
              COMPOSE_FILE="docker-compose.yml"
              [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"

              # Stop any running stack to avoid file locks
              docker compose -f "$COMPOSE_FILE" down || true

              # Remove host-mounted data (hf_cache, mongo, prometheus, grafana)
              rm -rf "${{ inputs.deploy_path }}/data"/* || true

              # Start MongoDB alone so we can drop databases explicitly
              docker compose -f "$COMPOSE_FILE" up -d mongodb || true

              # Wait for MongoDB to accept connections
              for i in $(seq 1 30); do
                if docker compose -f "$COMPOSE_FILE" exec -T mongodb mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
                  echo "MongoDB is ready"
                  break
                fi
                echo "Waiting for MongoDB... ($i)"
                sleep 2
              done

              # Drop application databases to ensure a clean state
              docker compose -f "$COMPOSE_FILE" exec -T mongodb mongosh --quiet --eval "db.getSiblingDB('nlp_raw').dropDatabase(); db.getSiblingDB('nlp_clean').dropDatabase(); db.getSiblingDB('nlp_classified').dropDatabase(); db.getSiblingDB('nlp_models').dropDatabase(); db.getSiblingDB('nlp_ner').dropDatabase();" || true

              # Stop the temporary mongo service so the full stack can start fresh later
              docker compose -f "$COMPOSE_FILE" down || true
            fi

            # 3. Create .env file
            echo "--- Creating .env file ---"
            printf "%b" "${{ secrets.env_vars }}" > .env
            echo "Successfully created .env"

            # 4. Identify Compose File
            COMPOSE_FILE="docker-compose.yml"
            [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"
            echo "Using config: $COMPOSE_FILE"

            # 4. Orchestrate
            docker compose -f $COMPOSE_FILE build
            docker compose -f $COMPOSE_FILE up -d

            # 5. Housekeeping
            docker image prune -f
            echo "--- Deployment Successful ---"
