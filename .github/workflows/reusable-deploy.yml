name: Reusable Deploy

on:
  workflow_call:
    inputs:
      deploy_path:
        description: "Target directory on the server"
        required: false
        type: string
        default: "~/nlp-project"
      environment:
        description: "GitHub environment name"
        required: false
        type: string
        default: "production"
      reset_volumes:
        description: "If true, wipe application MongoDB databases before deploying"
        required: false
        type: boolean
        default: false
    secrets:
      HETZNER_IP:
        required: true
      HETZNER_USER:
        required: true
      HETZNER_PORT:
        required: false
      HETZNER_KEY:
        required: true
      env_vars:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Prepare Target and Sync Code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -euo pipefail
            echo "--- Starting deployment to ${{ inputs.deploy_path }} ---"
            
            # 1. Prepare directory
            mkdir -p ${{ inputs.deploy_path }}/data/{hf_cache,mongo}
            cd ${{ inputs.deploy_path }}

            # 2. Sync Code
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all --prune
              git reset --hard origin/${{ github.ref_name }}
            fi

      - name: Optional Database Wipe (Flag-Gated)
        if: ${{ inputs.reset_volumes == true }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -euo pipefail
            echo "--- reset_volumes=true: wiping MongoDB application databases ---"
            cd ${{ inputs.deploy_path }}

            COMPOSE_FILE="docker-compose.yml"
            [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"

            # Start MongoDB so database drop can run even if stack was stopped.
            docker compose -f "$COMPOSE_FILE" up -d mongodb

            READY=0
            for i in $(seq 1 30); do
              if docker compose -f "$COMPOSE_FILE" exec -T mongodb mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
                READY=1
                break
              fi
              echo "Waiting for MongoDB... ($i/30)"
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "MongoDB did not become ready in time"
              exit 1
            fi

            docker compose -f "$COMPOSE_FILE" exec -T mongodb mongosh --quiet --eval "db.getSiblingDB('nlp_raw').dropDatabase(); db.getSiblingDB('nlp_clean').dropDatabase(); db.getSiblingDB('nlp_classified').dropDatabase(); db.getSiblingDB('nlp_models').dropDatabase(); db.getSiblingDB('nlp_ner').dropDatabase();"

            echo "--- MongoDB application databases wiped ---"

      - name: Write Environment File
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -euo pipefail
            cd ${{ inputs.deploy_path }}

            # 3. Create .env file
            echo "--- Creating .env file ---"
            printf "%b" "${{ secrets.env_vars }}" > .env
            echo "Successfully created .env"

      - name: Build Images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -euo pipefail
            cd ${{ inputs.deploy_path }}

            # 4. Identify Compose File
            COMPOSE_FILE="docker-compose.yml"
            [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"
            echo "Using config: $COMPOSE_FILE"

            # 4. Build
            docker compose -f $COMPOSE_FILE build

      - name: Start Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -euo pipefail
            cd ${{ inputs.deploy_path }}

            COMPOSE_FILE="docker-compose.yml"
            [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"

            docker compose -f $COMPOSE_FILE up -d

      - name: Refresh Frontend Upstream Cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -euo pipefail
            cd ${{ inputs.deploy_path }}

            COMPOSE_FILE="docker-compose.yml"
            [ -f "docker-compose.prod.yml" ] && COMPOSE_FILE="docker-compose.prod.yml"

            # Frontend nginx resolves Docker DNS on startup; restart to pick up latest API container IP
            if docker compose -f "$COMPOSE_FILE" config --services | grep -qx frontend; then
              docker compose -f "$COMPOSE_FILE" restart frontend
            fi

      - name: Housekeeping
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          script: |
            set -euo pipefail

            # 5. Housekeeping
            docker image prune -f
            echo "--- Deployment Successful ---"
