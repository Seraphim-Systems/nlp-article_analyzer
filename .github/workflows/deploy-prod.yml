name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      reset_volumes:
        description: "If true, wipe application MongoDB databases before deploying"
        required: false
        default: false
        type: boolean

jobs:
  production-deploy:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      deploy_path: "~/nlp-project"
      environment: "production"
      reset_volumes: ${{ inputs.reset_volumes }}
    secrets:
      HETZNER_IP: ${{ secrets.HETZNER_IP }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_KEY: ${{ secrets.HETZNER_KEY }}
      HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
      env_vars: |
        GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY=${{ secrets.KAGGLE_KEY }}
        MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
        EVAL_SEPARABILITY_SAMPLE=${{ secrets.EVAL_SEPARABILITY_SAMPLE }}
