name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Stub heavy ML deps that require GPU / large downloads
          pip install --no-deps spacy
          pip install --no-deps torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers scikit-learn numpy pandas

          # Install remaining app + test deps
          pip install -r requirements.txt --no-deps
          pip install pytest pytest-cov pytest-mock

      - name: Run tests with coverage
        env:
          MONGO_URI: "mongodb://localhost:27017"
          PYTHONPATH: src:.
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v
